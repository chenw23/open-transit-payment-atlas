- id: muscat-mwasalat-buses
  country: Oman
  city: Muscat
  network: Mwasalat City Buses
  operator: Mwasalat
  modes: [city bus]
  official_website: https://tickets.mwasalat.om/mtbp/en-gb/other/help
  last_verified: "2026-07-26"
  boarding_validation: mixed
  exit_validation: required
  payment:
    cash:
      status: deprecated
      notes: Cash remains accepted on Muscat city buses through 31 July 2026. Mwasalat announced that onboard cash payment in Muscat and Salalah will end on 1 August 2026.
      source: Oman Daily cashless notice
    transit_card:
      status: yes
      methods: [Sayir eWallet]
      notes: Sayir stores credit for city travel and is funded through the Mwasalat app or web portal.
      source: Mwasalat Sayir
    contactless_bank_card:
      status: yes
      schemes: [Visa, Mastercard]
      notes: Onboard acceptance signage photographed on a Mwasalat city bus in Muscat on 26 July 2026 shows the contactless symbol and lists Visa and Mastercard. This confirms direct contactless card payment on the bus; whether a bank card must be presented again when alighting is not documented.
      source: Muscat Daily approved payment methods
    mobile_wallet:
      status: yes
      methods: [Apple Pay, Samsung Pay]
      notes: The same onboard acceptance sign lists Apple Pay and Samsung Pay alongside Visa and Mastercard, with no other wallet logo displayed. Mwasalat's July cashless notice independently lists both wallets. Sayir app QR validation is recorded separately below.
      source: Muscat Daily approved payment methods
    qr_code:
      status: yes
      methods: [Sayir account QR]
      notes: Use the account QR to validate both entry and exit.
      source: Mwasalat Sayir
    official_app:
      status: yes
      methods: [Mwasalat app]
      notes: The app can top up Sayir and presents the QR code to the onboard acceptance device.
      source: Mwasalat app
    paper_ticket:
      status: partial
      notes: Tickets can be purchased through Mwasalat points of sale, but city travel is increasingly centred on Sayir and app QR validation.
      source: Mwasalat help
    tourist_pass:
      status: no
      notes: A dedicated tourist-only Muscat bus pass is not documented.
  interoperability:
    fare_capping: unknown
    regional_card: yes
    national_card: yes
    notes: Sayir is the Mwasalat public-transport eWallet, and the official portal instructs riders to scan its account QR code on entry and exit. The available bank-card notices do not state whether the same exit-validation rule applies to cards.
  sources:

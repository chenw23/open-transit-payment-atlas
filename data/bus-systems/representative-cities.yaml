- id: london-buses
  country: United Kingdom
  city: London
  region: Greater London
  network: London Buses
  operator: Transport for London
  modes: [city bus, night bus]
  official_website: https://tfl.gov.uk/fares/find-fares/bus-and-tram-fares
  last_verified: "2026-07-22"
  boarding_validation: tap
  exit_validation: not_required
  payment:
    cash:
      status: no
      notes: London buses do not accept cash fares.
    transit_card:
      status: yes
      methods: [Oyster]
      source: TfL bus fares
    contactless_bank_card:
      status: yes
      schemes: [Visa, Mastercard, American Express]
      source: TfL contactless
    mobile_wallet:
      status: yes
      methods: [Apple Pay, Google Pay, Samsung Pay, Garmin Pay, Fitbit Pay]
      source: TfL contactless
    qr_code:
      status: no
      notes: QR boarding payment is not the standard London bus fare medium.
    official_app:
      status: no
      notes: TfL apps can manage travel information or Oyster accounts but are not shown to the driver as a bus ticket.
    paper_ticket:
      status: partial
      notes: Paper products exist for specific concessions or arrangements but are not the standard visitor fare.
    tourist_pass:
      status: partial
      methods: [Visitor Oyster]
      notes: Visitors can use Visitor Oyster, but ordinary contactless payment is also supported.
      source: TfL bus fares
  interoperability:
    fare_capping: yes
    regional_card: yes
    national_card: no
    notes: Oyster and contactless daily or weekly capping applies under TfL fare rules.
  sources:

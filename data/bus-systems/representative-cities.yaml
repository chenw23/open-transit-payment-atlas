- id: bangkok-bmta-buses
  country: Thailand
  city: Bangkok
  region: Bangkok metropolitan area
  network: BMTA Buses
  operator: Bangkok Mass Transit Authority
  modes: [city bus]
  official_website: https://www.bmta.co.th/
  last_verified: "2026-07-29"
  boarding_validation: mixed
  exit_validation: not_required
  payment:
    cash:
      status: yes
      notes: Cash remains the generally available fare method on BMTA buses; fares vary by bus type and route.
    transit_card:
      status: yes
      methods: [BMTA electronic fare card, BMTA electronic prepaid pass]
      notes: BMTA electronic single-fare and prepaid passes are accepted through conductor-held EDC equipment. Eligible riders can also use a Thai State Welfare Card.
      source: BMTA cashless launch
    contactless_bank_card:
      status: partial
      schemes: [Visa, Mastercard]
      notes: >-
        BMTA launched contactless debit and credit card payment across its routes,
        and later BMTA and KTC material still lists EMV cards as a payment channel.
        Current passenger guidance nevertheless describes contactless payment as
        available only on certain buses and warns that it may not work properly.
        Treat card acceptance as device-dependent and carry cash.
      source: KTC EMV guide
    mobile_wallet:
      status: partial
      methods: [TrueMoney, Paotang]
      notes: BMTA management identified TrueMoney and Paotang among current payment channels in 2025. These are local app-based methods and may depend on the conductor's payment device; Apple Pay, Google Pay, Alipay and WeChat Pay are not established as general BMTA fare methods.
      source: BMTA payment channels interview
    qr_code:
      status: partial
      methods: [Krungthai NEXT, Thai mobile banking QR]
      notes: BMTA's cashless launch documents QR fare payment through Krungthai NEXT or participating Thai mobile-banking apps. QR uses the same conductor-held EDC system as card payment, and current passenger guidance treats mobile payment availability as bus- and device-dependent. Alipay and WeChat Pay are not established as general BMTA fare methods.
      source: BMTA cashless launch
    official_app:
      status: no
      notes: The official BMTA BUS app provides routes, stops and live-bus information; it is not documented as a fare credential.
      source: BMTA BUS app
    paper_ticket:
      status: yes
      methods: [Onboard fare ticket]
      notes: The conductor issues an onboard ticket after fare payment.
    tourist_pass:
      status: no
      notes: A dedicated BMTA tourist bus pass is not documented.
  interoperability:
    fare_capping: no
    regional_card: partial
    national_card: no
    notes: Bangkok bus operators do not share one universal fare medium. This record is limited to BMTA-operated buses and should not be applied to private operators.
  sources:

- id: hong-kong-mtr
  country: Hong Kong
  city: Hong Kong
  system: MTR
  operator: MTR Corporation
  modes: [metro, suburban rail, airport rail, light rail]
  official_website: https://www.mtr.com.hk/en/customer/tickets/tf_index.html
  last_verified: "2026-07-22"
  payment:
    gate_entry:
      local_transit_card:
        status: yes
        methods: [Octopus]
        source: MTR tickets and fares
      contactless_bank_card:
        status: yes
        schemes: [Visa, Mastercard, UnionPay]
        notes: Available for MTR rides including Airport Express; not available for Light Rail or MTR Bus.
        source: MTR contactless
      mobile_wallet:
        status: yes
        methods: [Octopus on iPhone or Apple Watch, Octopus on Android, contactless bank-card wallet]
        source: Octopus mobile FAQs
      qr_code:
        status: partial
        methods: [AlipayHK EasyGo, Alipay Transit QR, UnionPay App MTR Transit QR, WeChat Transit QR]
        notes: QR products and supported lines vary; Airport Express support is explicitly documented.
        source: MTR tickets and fares
      official_app:
        status: partial
        notes: MTR Mobile supports travel services, while gate payment depends on a supported QR or fare product.
      paper_or_token:
        status: yes
        methods: [Single Journey Ticket]
        source: MTR tickets and fares
      tourist_pass:
        status: yes
        methods: [Tourist Day Pass, Airport Express Travel Pass, Tourist Octopus]
        source: MTR tickets and fares
    ticket_machine:
      cash:
        status: yes
        source: MTR tickets and fares
      bank_card:
        status: partial
        notes: Card acceptance depends on the machine and ticket product.
      contactless_card:
        status: partial
        notes: Some ticket machines or self-service points accept contactless cards; this is not universal.
      mobile_wallet:
        status: partial
        notes: Availability follows the payment capability of the relevant machine or product.
      qr_payment:
        status: partial
        notes: CNRT records Alipay and WeChat support only at selected stations for ticket purchase.
        source: CNRT Pay
  interoperability:
    open_loop: partial
    fare_capping: partial
    regional_card: yes
    national_card: partial
    notes: Octopus is the principal interoperable fare medium. Contactless bank cards have product and mode limitations.
  sources:
    - title: MTR tickets and fares
      url: https://www.mtr.com.hk/en/customer/tickets/tf_index.html
      accessed: "2026-07-22"
    - title: MTR contactless
      url: https://www.mtr.com.hk/en/customer/main/about_contactless.html
      accessed: "2026-07-22"
    - title: Octopus mobile FAQs
      url: https://www.octopus.com.hk/en/consumer/customer-service/faq/apple-pay/use.html
      accessed: "2026-07-22"
    - title: Octopus on Android
      url: https://www.octopus.com.hk/en/consumer/customer-service/faq/android-octopus/get.html
      accessed: "2026-07-22"
    - title: CNRT Pay
      url: https://ivysauro.github.io/CNRT/data/Pay
      accessed: "2026-07-22"

- id: macao-light-rapid-transit

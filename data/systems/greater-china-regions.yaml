  payment:
    gate_entry:
      local_transit_card:
        status: yes
        methods: [LRT Card, Macau Pass]
        source: MLRT tickets and fares
      contactless_bank_card:
        status: no
        notes: Bank cards are accepted at customer service centres for ticket purchase, not documented for direct gate entry.
      mobile_wallet:
        status: no
        notes: Mobile payments are accepted at customer service centres, not documented for direct gate entry.
      qr_code:
        status: no
        notes: QR payment is a purchase channel rather than a direct gate-entry medium.
      official_app:
        status: no
      paper_or_token:
        status: yes
        methods: [Single Journey Ticket]
        source: MLRT tickets and fares
      tourist_pass:
        status: unknown
    ticket_machine:
      cash:
        status: yes
        source: MLRT tickets and fares
      bank_card:
        status: no
        notes: Automatic ticket vending machines accept Macao pataca cash and LRT Card only.
        source: MLRT tickets and fares
      contactless_card:
        status: no
        notes: Contactless bank-card payment is available at customer service centres, not TVMs.
        source: MLRT tickets and fares
      mobile_wallet:
        status: no
        notes: Alipay, WeChat Pay and Simple Pay are customer-service-centre methods, not TVM methods.
        source: MLRT tickets and fares
      qr_payment:
        status: no
        notes: Mobile QR payments are accepted at customer service centres, not TVMs.
        source: MLRT tickets and fares

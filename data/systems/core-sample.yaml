- id: london-underground
  country: United Kingdom
  city: London
  region: Greater London
  system: London Underground
  operator: Transport for London
  modes: [metro]
  official_website: https://tfl.gov.uk/fares/
  last_verified: "2026-07-21"
  payment:
    gate_entry:
      local_transit_card:
        status: yes
        methods: [Oyster]
        source: TfL fares
      contactless_bank_card:
        status: yes
        schemes: [Visa, Mastercard, American Express]
        source: TfL contactless
      mobile_wallet:
        status: yes
        methods: [Apple Pay, Google Pay, contactless mobile wallet]
        source: TfL contactless
      qr_code:
        status: no
        notes: QR tickets are not the standard gate-entry method for the Underground.
      official_app:
        status: partial
        notes: TfL account/app supports account management, not direct QR gate entry.
      paper_or_token:
        status: partial
        methods: [Paper ticket]
        notes: Paper tickets remain available for some journeys but are not the recommended payment method.
      tourist_pass:
        status: partial
        methods: [Visitor Oyster]
        source: TfL fares
    ticket_machine:
      cash:
        status: partial
        notes: Availability varies by station and machine.
      bank_card:
        status: yes
        schemes: [Visa, Mastercard, American Express]
        source: TfL fares
      contactless_card:
        status: yes
        schemes: [Visa, Mastercard, American Express]
        source: TfL contactless
      mobile_wallet:
        status: partial
        notes: Treated as partial because support follows card acceptance at machines and varies by station/machine.
        methods: [Apple Pay, Google Pay]
      qr_payment:
        status: no
  interoperability:
    open_loop: yes
    fare_capping: yes
    regional_card: yes
    national_card: no
    notes: Oyster and contactless support daily/weekly capping across TfL modes with rules by zone and mode.
  sources:
    - title: TfL fares
      url: https://tfl.gov.uk/fares/
      accessed: "2026-07-21"
    - title: TfL contactless
      url: https://contactless.tfl.gov.uk/
      accessed: "2026-07-22"
  notes: Treat London as the reference implementation for mature open-loop urban rail payment.


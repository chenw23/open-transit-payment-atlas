- id: toronto-ttc
  country: Canada
  city: Toronto
  region: Greater Toronto and Hamilton Area
  system: TTC Subway and Light Rail
  operator: Toronto Transit Commission
  modes: [subway, light rail, streetcar]
  official_website: https://www.ttc.ca/Fares-and-passes/
  last_verified: "2026-07-22"
  payment:
    gate_entry:
      local_transit_card:
        status: yes
        methods: [PRESTO card, PRESTO Ticket]
        source: TTC fares and passes
      contactless_bank_card:
        status: yes
        schemes: [Visa, Mastercard, American Express, Interac Debit]
        source: TTC bank card payment
      mobile_wallet:
        status: yes
        methods: [Apple Pay, Google Pay, PRESTO in mobile wallet]
        source: TTC bank card payment
      paper_or_token:
        status: partial
        methods: [Paper transfer]
        notes: Paper transfers are proof of payment for cash fares, not a general reloadable gate medium.
      tourist_pass:
        status: partial
        methods: [PRESTO day pass products]
        notes: Availability depends on the PRESTO fare product.
    ticket_machine:
      cash:
        status: yes
        source: TTC fare payment guide
      bank_card:
        status: partial
        notes: Fare vending machine payment capabilities vary by station and product.
      contactless_card:
        status: partial
        notes: Direct gate tapping is separately supported network-wide.
  interoperability:
    open_loop: yes
    fare_capping: partial
    regional_card: yes
    national_card: no
    notes: PRESTO and contactless payment are accepted across TTC, with transfer and regional integration rules.
  sources:
    - title: TTC fares and passes
      url: https://www.ttc.ca/Fares-and-passes/
      accessed: "2026-07-22"
    - title: TTC bank card payment
      url: https://www.ttc.ca/riding-the-ttc/Updates/Pay-your-fare-with-your-debit-or-credit-card
      accessed: "2026-07-22"
    - title: TTC fare payment guide
      url: https://www.ttc.ca/Fares-and-passes/Fare-Payment-Guide
      accessed: "2026-07-22"

- id: mexico-city-metro
  country: Mexico
  city: Mexico City
  system: Mexico City Metro
  operator: Sistema de Transporte Colectivo
  modes: [metro]
  official_website: https://www.metro.cdmx.gob.mx/
  last_verified: "2026-07-22"
  payment:
    gate_entry:
      local_transit_card:
        status: yes
        methods: [Tarjeta de Movilidad Integrada]
        source: Mexico City MI card
      contactless_bank_card:
        status: no
        notes: The MI card is the documented access medium for the Metro; bank-card gate payment documented for Metrobús is not generalized to Metro.
      mobile_wallet:
        status: no
        notes: Phone NFC can reload an MI card, but is not documented as direct Metro gate entry.
      qr_code:
        status: no
        notes: Direct QR gate entry is not documented for the Metro.
      official_app:
        status: no
      paper_or_token:
        status: deprecated
        notes: The integrated mobility card replaced the former magnetic ticket for regular access.
    ticket_machine:
      cash:
        status: yes
        notes: MI cards can be bought or reloaded with cash at Metro ticket offices and other network vending machines.
        source: Mexico City MI card
      bank_card:
        status: unknown
  interoperability:
    open_loop: no
    fare_capping: no
    regional_card: yes
    national_card: no
    notes: The MI card is shared across several Mexico City public transport modes.
  sources:
    - title: Mexico City MI card
      url: https://mexicocity.cdmx.gob.mx/e/getting-around/mexico-city-metro-card/
      accessed: "2026-07-22"
    - title: Mexico City Metro
      url: https://www.metro.cdmx.gob.mx/
      accessed: "2026-07-22"

- id: sao-paulo-metro
  country: Brazil
  city: Sao Paulo
  region: Sao Paulo metropolitan area
  system: Sao Paulo Metro
  operator: Companhia do Metropolitano de Sao Paulo
  modes: [metro, monorail]
  official_website: https://www.metro.sp.gov.br/sua-viagem/bilhetes-cartoes/
  last_verified: "2026-07-22"
  payment:
    gate_entry:
      local_transit_card:
        status: yes
        methods: [Bilhete Unico, TOP card]
        source: Sao Paulo tickets and cards
      contactless_bank_card:
        status: partial
        schemes: [Visa, Mastercard]
        notes: Contactless debit or credit cards are accepted at designated gates and stations, not represented as universal at every gate.
        source: TurisMetro
      mobile_wallet:
        status: partial
        notes: Contactless bank-card wallets follow the designated open-loop gate rollout.
      qr_code:
        status: yes
        methods: [Bilhete Unitario QR Code]
        source: Sao Paulo QR tickets
      official_app:
        status: yes
        methods: [TOP app QR ticket]
        source: Sao Paulo QR tickets
      paper_or_token:
        status: yes
        methods: [Printed QR single ticket]
        source: Sao Paulo QR tickets
      tourist_pass:
        status: unknown
    ticket_machine:
      cash:
        status: partial
        notes: Cash is accepted at ticket offices; self-service QR ticket machines primarily document debit-card payment.
      bank_card:
        status: unknown
        notes: The current official ticket page confirms self-service QR-ticket machines but does not clearly state their current bank-card acceptance.
      contactless_card:
        status: unknown
      qr_payment:
        status: partial
        notes: PIX and app channels can purchase QR tickets, but this is separate from a universal machine QR-payment function.
  interoperability:
    open_loop: partial
    fare_capping: unknown
    regional_card: yes
    national_card: no
    notes: The network supports stored-value cards and QR tickets; direct bank-card entry is limited to designated gates.
  sources:
    - title: Sao Paulo tickets and cards
      url: https://www.metro.sp.gov.br/sua-viagem/bilhetes-cartoes/
      accessed: "2026-07-22"
    - title: Sao Paulo QR tickets
      url: https://www.metro.sp.gov.br/sua-viagem/bilhetes-cartoes/
      accessed: "2026-07-22"
    - title: TurisMetro
      url: https://www.metro.sp.gov.br/sua-viagem/turismetro/
      accessed: "2026-07-22"

